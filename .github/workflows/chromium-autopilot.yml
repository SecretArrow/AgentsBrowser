# Chromium autopilot: dispatches the full chromium-build workflow
# automatically whenever there is un-built work on main — no manual dispatch
# is ever needed. If a chromium-builder self-hosted runner is offline, the
# dispatched run simply stays queued and starts the moment a runner registers.
#
# Dispatch guards (all must pass):
#   1. no queued/in-progress chromium-build run (queued = waiting for runner
#      or already building; either way a new dispatch would be a duplicate)
#   2. current main HEAD not already picked up by an earlier run
#   3. if the last run failed: no open ci-failure issue for that same commit
#      (closing the issue is the manual "retry now" signal)
#
# NOTE: the self-hosted runners list API needs `administration`, which
# GITHUB_TOKEN cannot get, so runner availability is inferred from run state.
name: chromium-autopilot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: chromium-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch chromium-build when there is un-built work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error

          tok = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]

          def api(path):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={"Authorization": f"token {tok}",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          def dispatch(path, data):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=json.dumps(data).encode(),
                  headers={"Authorization": f"token {tok}",
                           "Accept": "application/vnd.github+json"},
                  method="POST")
              try:
                  urllib.request.urlopen(req)
                  return 200
              except urllib.error.HTTPError as e:
                  return e.code

          def step(msg):
              print(f"::notice::{msg}")

          head = api(f"/repos/{repo}/commits/main")["sha"]
          print(f"HEAD = {head[:7]}")

          runs = api(f"/repos/{repo}/actions/workflows/chromium-build.yml/"
                     f"runs?per_page=10").get("workflow_runs", [])

          # Guard 1: an active or runner-waiting run already exists.
          for r in runs:
              if r["status"] in ("queued", "in_progress"):
                  step(f"chromium-build run {r['id']} is {r['status']} "
                       f"(waiting for runner or building); no dispatch.")
                  raise SystemExit(0)

          # Guard 2+3: HEAD already picked up by the most recent run.
          #   success/other → nothing to do. failure → retry unless the
          #   ci-failure issue is still open (closing it re-enables retries).
          if runs and runs[0]["head_sha"] == head:
              latest = runs[0]
              if latest["conclusion"] != "failure":
                  step(f"Commit {head[:7]} already handled "
                       f"(run {latest['id']}: {latest['conclusion']}).")
                  raise SystemExit(0)
              short = head[:7]
              issues = api(f"/repos/{repo}/issues"
                           f"?labels=ci-failure&state=open&per_page=30")
              if any(f"chromium-build failed on {short}" in
                     i.get("title", "") for i in issues):
                  step(f"Failure for {short} already reported; "
                       f"waiting for a fix commit (or close the issue to retry).")
                  raise SystemExit(0)
              step(f"Retrying failed commit {short} (issue closed/absent).")

          code = dispatch(
              f"/repos/{repo}/actions/workflows/chromium-build.yml/dispatches",
              {"ref": "main"})
          if code in (200, 204):
              step(f"Dispatched chromium-build on main ({head[:7]}). "
                   f"It will start when a chromium-builder runner is online.")
          else:
              step(f"Dispatch returned http={code}; will retry next tick.")
          PYEOF
