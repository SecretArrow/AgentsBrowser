# Full Chromium Android fork build — the real browser (100–150 MB APKs).
#
# Two lanes, picked by the `runner` dispatch input (default: hosted16):
#   A) self-hosted  → a machine you registered with the `chromium-builder`
#                     label. Free, unlimited time (docs/RUNNER-SETUP.md).
#   B) hosted16     → GitHub larger runner `ubuntu-latest-16-cores`
#                     (16 vCPU / 64 GB RAM / 256 GB SSD). The only GitHub
#                     hosted machine class that fits a Chromium build.
#                     Requires billing enabled on the account.
#
# A full build takes ~4–6 h on 16 cores (symbol_level=0, no component
# build). On tag pushes (v*) the resulting APKs are attached to the
# GitHub release created by release-hosted.
name: chromium-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to build"
        required: false
        default: "guard"
        type: choice
        options:
          - guard
          - hosted16
          - self-hosted
      target_cpu:
        description: "Chromium target_cpu"
        required: false
        default: "arm64"
        type: choice
        options:
          - arm64
          - arm
          - x64

permissions:
  contents: write
  issues: write

concurrency:
  group: chromium-build-${{ github.ref }}
  cancel-in-progress: false

# Lane is picked by the `runner` input. `guard` (the default) resolves it
# from the repo variable CHROMIUM_RUNNER ("self-hosted" or "hosted16"):
#   - set it once after enabling billing or registering your builder, and
#     every future tag/dispatch builds the full fork with zero code changes.
# If the lane is unconfigured the runner job exits with a notice instead of
# queueing a zombie run that would wait forever for a nonexistent runner.
jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.pick.outputs.lane }}
      cpu: ${{ steps.pick.outputs.cpu }}
    steps:
      - id: pick
        env:
          CHROMIUM_RUNNER: ${{ vars.CHROMIUM_RUNNER }}
          IN_RUNNER: ${{ inputs.runner }}
        run: |
          lane="${IN_RUNNER:-guard}"
          if [ "$lane" = "guard" ] || [ -z "$lane" ]; then
            lane="${CHROMIUM_RUNNER:-none}"
          fi
          case "$lane" in
            self-hosted) echo "lane=self-hosted" >> "$GITHUB_OUTPUT" ;;
            hosted16)    echo "lane=ubuntu-latest-16-cores" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::Full Chromium build is armed but not enabled."
              echo "::notice::Set repo variable CHROMIUM_RUNNER=hosted16 (needs GitHub billing) or self-hosted (see docs/RUNNER-SETUP.md)."
              echo "lane=none" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "picked lane: $lane"

  build:
    needs: runner
    if: ${{ needs.runner.outputs.lane != 'none' }}
    # Lane A: your own machine (free). Lane B: paid 16-core larger runner.
    runs-on: ${{ needs.runner.outputs.lane }}
    timeout-minutes: 360
    env:
      TARGET_CPU: ${{ inputs.target_cpu || 'arm64' }}
    steps:
      - uses: actions/checkout@v4

      # Free up disk and add swap — hosted16 has 256 GB SSD but ships with
      # ~30 GB of preinstalled toolchains we don't need for Chromium.
      - name: Free disk space + add swap
        if: inputs.runner != 'self-hosted'
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 4G /mnt/4G.swap
          sudo chmod 600 /mnt/4G.swap
          sudo mkswap /mnt/4G.swap
          sudo swapon /mnt/4G.swap
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Preflight (disk, RAM, tools)
        run: bash scripts/preflight-checks.sh
        env:
          PREFLIGHT_SKIP: ${{ inputs.runner == 'self-hosted' && '' || '1' }}

      - name: Sync Chromium (fetch + hooks, ~25 GB)
        timeout-minutes: 90
        run: bash scripts/sync-chromium.sh
        env:
          CHROMIUM_BRANCH: android-15.0.0_r1

      - name: Apply agent_browser layer + patches
        run: bash scripts/apply-agent-layer.sh

      - name: Configure GN
        run: bash scripts/configure-gn.sh

      - name: Build APK (~4–5 h on 16 cores)
        timeout-minutes: 330
        run: bash scripts/build-chromium-android.sh

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p apks
          find chromium/out/AgentBrowser/apks -name '*.apk' -exec cp {} apks/ \; || true
          find chromium/out/AgentBrowser -maxdepth 1 -name '*.apk' -exec cp {} apks/ \; || true
          # Rename to release-friendly names: AgentBrowser-<ver>-<cpu>.apk
          VER="$(grep AGENT_BROWSER_VERSION VERSION | cut -d= -f2)"
          for f in apks/*.apk; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            case "$base" in
              *arm64*) cpu="arm64-v8a" ;;
              *arm*)   cpu="armeabi-v7a" ;;
              *x64*)   cpu="x86_64" ;;
              *x86*)   cpu="x86" ;;
              *)       cpu="unknown" ;;
            esac
            [ "$cpu" = "unknown" ] && cpu="$TARGET_CPU"
            mv "$f" "apks/AgentBrowser-${VER}-${cpu}-chromium.apk"
          done
          ls -la apks/
          echo "count=$(ls apks/*.apk 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-browser-chromium-apks
          path: apks/*.apk
          retention-days: 14
          if-no-files-found: warn

      # On tag pushes, attach the full-fork APKs to the release that
      # release-hosted already created for the same tag.
      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/') && steps.collect.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          overwrite_files: true

      - name: File build failure report
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chromium-build failed on ${context.sha.slice(0,7)}`,
              body: 'Auto-fix will retry. Run: ' + context.runId,
              labels: ['ci-failure']
            });
