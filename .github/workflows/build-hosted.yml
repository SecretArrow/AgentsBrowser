# Full build lane on GitHub-hosted runners: compiles ALL agent modules,
# runs unit tests, uploads AAR artifacts. Fast: cached Gradle, parallel jobs.
name: build-full

on:
  push:
    branches: [main]
    paths:
      - "agent_browser/**"
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/build-hosted.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: no android-actions/setup-android here — the ubuntu-latest image
      # ships the Android SDK preinstalled (ANDROID_HOME set, licenses
      # accepted). The setup-android action currently fails on sdkmanager 16.

      - uses: gradle/actions/setup-gradle@v3

      - name: Gradle report (version sanity)
        run: gradle --version | head -8

      - name: Assemble all modules (release)
        run: gradle assembleRelease --parallel --build-cache --stacktrace

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK is preinstalled on ubuntu-latest; skip setup-android
      # (fails on sdkmanager 16 'tools' package).

      - uses: gradle/actions/setup-gradle@v3

      - name: Build APKs (ABI split + universal)
        run: gradle :app:assembleRelease --parallel --build-cache --stacktrace

      - name: Collect APK artifacts
        run: |
          mkdir -p apks
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} apks/ \;
          ls -la apks/

      - uses: actions/upload-artifact@v4
        with:
          name: agent-browser-apks
          path: apks/*.apk
          retention-days: 14
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # See note in the compile job: SDK is preinstalled on the image.

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests (all modules)
        run: gradle testReleaseUnitTest --parallel --continue --stacktrace

      - name: Publish test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: warn
