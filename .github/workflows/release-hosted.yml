# Hosted release lane: on version tags, builds the installable browser app
# and publishes a GitHub Release with per-ABI APKs + universal APK, signed
# with AB_KEYSTORE_* secrets when present (debug-signed otherwise), and an
# ABI table in the release notes. The full Chromium fork APK/AAB lane
# (release.yml) runs on a self-hosted chromium-builder runner for the same tag.
name: release-hosted

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK is preinstalled on ubuntu-latest; skip setup-android
      # (fails on sdkmanager 16 'tools' package).

      - uses: gradle/actions/setup-gradle@v3

      # Decode the production keystore from CI secrets when configured; Gradle
      # picks it up via AB_KEYSTORE_* env vars and falls back to debug signing
      # when absent, so the lane stays green in both cases.
      - name: Decode signing keystore from secrets
        env:
          AB_KEYSTORE_BASE64: ${{ secrets.AB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AB_KEYSTORE_BASE64" ]; then
            echo "$AB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ab.keystore"
            {
              echo "AB_KEYSTORE_PATH=$RUNNER_TEMP/ab.keystore"
              echo "AB_KEYSTORE_PASSWORD=${{ secrets.AB_KEYSTORE_PASSWORD }}"
              echo "AB_KEY_ALIAS=${{ secrets.AB_KEY_ALIAS }}"
              echo "AB_KEY_PASSWORD=${{ secrets.AB_KEY_PASSWORD }}"
              echo "AB_SIGNED=1"
            } >> "$GITHUB_ENV"
            echo "Production signing configured."
          else
            echo "AB_SIGNED=0" >> "$GITHUB_ENV"
            echo "AB_KEYSTORE_BASE64 not set; APKs will be debug-signed."
          fi

      - name: Build release APKs (ABI split + universal)
        run: gradle :app:assembleRelease --parallel --build-cache --stacktrace

      - name: Stamp version record
        run: |
          {
            echo "Agent Browser $(grep AGENT_BROWSER_VERSION VERSION | cut -d= -f2)"
            echo "Chromium base: $(grep CHROMIUM_BASE VERSION | cut -d= -f2)"
            echo "Patch revision: $(git rev-list --count HEAD)"
            echo "Build number: ${{ github.run_number }}"
            echo "Signing: $([ "$AB_SIGNED" = "1" ] && echo 'production (AB_KEYSTORE)' || echo 'debug (CI fallback)')"
            echo "Built by: release-hosted (GitHub-hosted lane)"
          } > build-metadata.txt
          cat build-metadata.txt

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/ \;
          cp build-metadata.txt dist/
          ls -la dist/

      # Release notes body is generated by the shell so version strings and
      # the signing mode are real values, not literals.
      - name: Generate release notes body
        run: |
          ABV="$(grep AGENT_BROWSER_VERSION VERSION | cut -d= -f2)"
          BASE="$(grep CHROMIUM_BASE VERSION | cut -d= -f2)"
          if [ "$AB_SIGNED" = "1" ]; then SIG="production (AB_KEYSTORE)"; else SIG="debug (CI fallback)"; fi
          cat > release-notes.md <<MD
          ## Downloads — pick the APK for your device

          | File | ABI | Use on |
          |---|---|---|
          | \`app-arm64-v8a-release.apk\` | arm64-v8a | Modern phones (recommended) |
          | \`app-armeabi-v7a-release.apk\` | armeabi-v7a | Older 32-bit phones |
          | \`app-x86-release.apk\` | x86 | Legacy emulators / tablets |
          | \`app-x86_64-release.apk\` | x86_64 | Emulators, Chromebooks |
          | \`app-universal-release.apk\` | all | Any device (larger) |

          **Install tip:** most users should grab \`app-arm64-v8a-release.apk\`.
          Unsure? Install \`app-universal-release.apk\`.

          ---

          Agent Browser **$ABV**
          Chromium base: \`$BASE\` · Build number: ${{ github.run_number }} · Signing: $SIG

          The full Chromium fork APK/AAB is produced by the \`chromium-build\`
          lane on a self-hosted \`chromium-builder\` runner for the same tag
          (see docs/RUNNER-SETUP.md).
          MD
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event.inputs.draft || 'false' }}
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            dist/*.apk
            dist/build-metadata.txt
